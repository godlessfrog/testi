<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lus Production</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <style>
    /* ── Variables ── */
    :root {
      --accent:   #C8621A;
      --accent2:  #FF9A3C;
      --bg:       #0A0A0A;
      --card:     #1A1A1A;
      --card2:    #232323;
      --border:   rgba(255,255,255,0.08);
      --text:     #FFFFFF;
      --muted:    #888;
      --red:      #FF3B5C;
      --phone-w:  390px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at 20% 20%, #1a0800 0%, #0A0A0A 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      gap: 18px;
    }

    .brand-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3.5px;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* ── Phone shell ── */
    .phone {
      width: var(--phone-w);
      height: 860px;
      border-radius: 46px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      box-shadow:
        0 0 0 1px rgba(200,98,26,0.22),
        0 0 0 8px rgba(200,98,26,0.04),
        0 36px 90px rgba(0,0,0,0.75),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* ── Screens track ── */
    .clip { flex: 1; overflow: hidden; position: relative; }

    .track {
      display: flex;
      height: 100%;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .screen {
      min-width: var(--phone-w);
      width: var(--phone-w);
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .scroller {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .scroller::-webkit-scrollbar { display: none; }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
      background: rgba(10,10,10,0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
      line-height: 1;
    }
    .logo em { font-style: normal; color: var(--accent); }

    .bar-icons { display: flex; gap: 4px; }

    .ib {
      background: none;
      border: none;
      color: var(--text);
      font-size: 21px;
      cursor: pointer;
      padding: 6px;
      border-radius: 10px;
      line-height: 1;
      transition: background 0.15s, opacity 0.15s;
    }
    .ib:hover { background: rgba(255,255,255,0.07); }

    /* ── Stories bar ── */
    .stories-bar {
      padding: 13px 0 11px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .stories-row {
      display: flex;
      gap: 13px;
      overflow-x: auto;
      padding: 2px 16px;
      scrollbar-width: none;
    }
    .stories-row::-webkit-scrollbar { display: none; }

    .s-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .s-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(45deg, #C8621A, #FF9A3C, #FF006E);
      transition: transform 0.2s, opacity 0.2s;
    }
    .s-ring.seen { background: rgba(255,255,255,0.18); }
    .s-ring:hover { transform: scale(1.07); }

    .s-ava {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2.5px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      user-select: none;
    }

    .s-name {
      font-size: 10px;
      color: var(--muted);
      max-width: 64px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Post card ── */
    .post-card { border-bottom: 1px solid var(--border); }

    .post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 15px;
    }

    .post-user {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .ava {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      user-select: none;
    }
    .ava-40 { width: 40px; height: 40px; font-size: 15px; }
    .ava-36 { width: 36px; height: 36px; font-size: 14px; }
    .ava-32 { width: 32px; height: 32px; font-size: 12px; }
    .ava-28 { width: 28px; height: 28px; font-size: 11px; }
    .ava-90 { width: 90px; height: 90px; font-size: 34px; }

    .post-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .post-loc  { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* ── Post image ── */
    .post-img {
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(32px);
      pointer-events: none;
    }

    .img-mid {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-badge {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-badge i { font-size: 38px; color: rgba(255,255,255,0.55); }

    .post-img:hover .img-badge { background: rgba(255,255,255,0.18); }

    /* ── Post actions ── */
    .post-acts {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px 5px;
    }

    .acts-l { display: flex; gap: 1px; }

    .act {
      background: none;
      border: none;
      color: var(--text);
      font-size: 23px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 10px;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
    }
    .act:hover { background: rgba(255,255,255,0.06); }
    .act.liked { color: var(--red); }
    .act.liked i { animation: hpop 0.28s ease; }
    .act.saved  { color: var(--accent); }

    @keyframes hpop {
      0%  { transform: scale(1); }
      40% { transform: scale(1.45); }
      100%{ transform: scale(1); }
    }

    .post-stats { padding: 0 15px 5px; }
    .likes-line { font-size: 13px; font-weight: 600; color: var(--text); }
    .cap-line   { font-size: 13px; color: var(--text); line-height: 1.55; margin-top: 2px; }
    .cap-line strong { font-weight: 600; }
    .more-comments {
      font-size: 13px; color: var(--muted);
      cursor: pointer; margin-top: 3px;
      transition: color 0.15s;
    }
    .more-comments:hover { color: #bbb; }
    .time-line { font-size: 10px; color: #3a3a3a; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px; }

    /* Inline comment input */
    .inline-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px 13px;
    }
    .inline-inp {
      flex: 1;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 15px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .inline-inp::placeholder { color: #444; }
    .inline-inp:focus { border-color: rgba(200,98,26,0.5); }

    /* ── Bottom nav ── */
    .bottom-nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px 14px;
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .nb {
      background: none;
      border: none;
      color: #555;
      font-size: 27px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 14px;
      line-height: 1;
      transition: color 0.2s, background 0.15s;
    }
    .nb:hover { color: var(--muted); background: rgba(255,255,255,0.05); }
    .nb.on { color: var(--accent); }

    .nb-fab {
      width: 52px; height: 52px;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 25px; color: #fff;
      box-shadow: 0 4px 18px rgba(200,98,26,0.5);
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .nb-fab:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(200,98,26,0.65); }

    /* ════════════════════════════════
       SCREEN 2 — POST DETAIL
    ════════════════════════════════ */
    .detail-img {
      width: 100%;
      aspect-ratio: 4/3;
      position: relative;
      overflow: hidden;
    }

    .comment-list {
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .cmt {
      display: flex;
      gap: 11px;
      animation: fup 0.25s ease both;
    }
    @keyframes fup {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .cb      { flex: 1; min-width: 0; }
    .cb-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .cb-text { font-size: 13px; color: #ccc; line-height: 1.55; margin-top: 2px; }
    .cb-meta { display: flex; gap: 10px; margin-top: 5px; }
    .cb-meta span { font-size: 11px; color: #444; cursor: pointer; transition: color 0.15s; }
    .cb-meta span:hover { color: var(--muted); }

    .comment-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px 22px;
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cmt-inp {
      flex: 1;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .cmt-inp::placeholder { color: #444; }
    .cmt-inp:focus { border-color: rgba(200,98,26,0.5); }

    .send-btn {
      background: none; border: none; cursor: pointer;
      font-size: 22px; color: var(--accent);
      transition: opacity 0.15s, transform 0.15s;
    }
    .send-btn:hover { opacity: 0.7; transform: scale(1.1) translateX(1px); }

    /* ════════════════════════════════
       SCREEN 3 — PROFILE
    ════════════════════════════════ */
    .profile-top {
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .p-ava-ring {
      width: 92px; height: 92px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent), var(--accent2), #FF006E);
    }

    .p-ava-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 3px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 33px;
      font-weight: 800;
      color: #fff;
    }

    .p-name    { font-size: 18px; font-weight: 700; color: var(--text); }
    .p-handle  { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .p-bio     { font-size: 13px; color: #bbb; text-align: center; line-height: 1.6; margin-top: 2px; }
    .p-bio a   { color: var(--accent); text-decoration: none; }

    .p-stats {
      display: flex;
      width: 100%;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .p-stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 8px;
      border-right: 1px solid var(--border);
      transition: background 0.15s;
      cursor: pointer;
    }
    .p-stat:last-child { border-right: none; }
    .p-stat:hover { background: rgba(255,255,255,0.04); }

    .p-stat-val { font-size: 17px; font-weight: 700; color: var(--text); }
    .p-stat-lbl { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .p-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .p-btn {
      flex: 1;
      padding: 11px 8px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.15s;
      font-family: inherit;
    }
    .p-btn:hover { opacity: 0.84; transform: scale(1.02); }
    .p-btn:active { transform: scale(0.98); }
    .p-btn.primary   { background: var(--accent); color: #fff; }
    .p-btn.secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
    .p-btn.icon-only { flex: 0; width: 44px; padding: 11px 0; display:flex; align-items:center; justify-content:center; }

    .p-divider { height: 1px; background: var(--border); }

    .p-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .g-cell {
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .g-cell:hover { filter: brightness(1.12); }
    .g-cell .blob { filter: blur(18px); }

    .g-cell-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .g-cell:hover .g-cell-overlay { background: rgba(0,0,0,0.25); }
    .g-cell-overlay i { font-size: 26px; color: rgba(255,255,255,0); transition: color 0.2s; }
    .g-cell:hover .g-cell-overlay i { color: rgba(255,255,255,0.85); }

    /* ════════════════════════════════
       STORY MODAL
    ════════════════════════════════ */
    .story-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .story-modal.open {
      opacity: 1;
      pointer-events: all;
    }

    .sv-frame {
      width: 100%;
      max-width: var(--phone-w);
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .sv-bg { position: absolute; inset: 0; transition: background 0.3s ease; }

    /* Decorative blobs inside story */
    .sv-b1 { position:absolute; width:220px; height:220px; border-radius:50%; filter:blur(40px); top:-50px; left:-60px; opacity:0.7; pointer-events:none; }
    .sv-b2 { position:absolute; width:200px; height:200px; border-radius:50%; filter:blur(40px); bottom:-40px; right:-50px; opacity:0.7; pointer-events:none; }

    .sv-progs {
      position: absolute;
      top: 14px; left: 14px; right: 14px;
      display: flex; gap: 4px; z-index: 5;
    }
    .sv-track {
      flex: 1; height: 2.5px;
      background: rgba(255,255,255,0.28);
      border-radius: 2px; overflow: hidden;
    }
    .sv-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; }
    .sv-fill.done { width: 100%; }

    .sv-top {
      position: absolute;
      top: 28px; left: 14px; right: 14px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 5;
    }
    .sv-user { display: flex; align-items: center; gap: 10px; }
    .sv-ava-el {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #fff;
    }
    .sv-uname { font-size: 14px; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    .sv-when  { font-size: 11px; color: rgba(255,255,255,0.6); }
    .sv-close-btn {
      background: rgba(0,0,0,0.25); border: none;
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; cursor: pointer;
      transition: background 0.15s;
    }
    .sv-close-btn:hover { background: rgba(0,0,0,0.45); }

    /* Tap zones */
    .sv-prev, .sv-next {
      position: absolute;
      top: 0; bottom: 0; width: 40%;
      cursor: pointer; z-index: 4;
    }
    .sv-prev { left: 0; }
    .sv-next { right: 0; }

    /* Center content in story */
    .sv-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 80px 20px 100px;
    }

    .sv-post-img {
      width: 200px; height: 200px;
      border-radius: 24px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .sv-post-img i { font-size: 64px; color: rgba(255,255,255,0.5); }

    .sv-caption {
      font-size: 15px; font-weight: 500; color: #fff;
      text-align: center; line-height: 1.5;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    .sv-bottom {
      position: absolute;
      bottom: 24px; left: 14px; right: 14px; z-index: 5;
    }

    .sv-reply-inp {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 26px;
      padding: 12px 20px;
      font-size: 14px; color: #fff;
      font-family: inherit; outline: none;
      backdrop-filter: blur(4px);
    }
    .sv-reply-inp::placeholder { color: rgba(255,255,255,0.45); }
    .sv-reply-inp:focus { border-color: rgba(255,255,255,0.5); }

    /* ── Notification toast ── */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(200,98,26,0.92);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 4000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ── */
    @media (max-width: 440px) {
      body   { padding: 0; background: var(--bg); }
      .phone { width: 100%; border-radius: 0; height: 100dvh; }
      .brand-label { display: none; }
    }
  </style>
</head>
<body>

<p class="brand-label">Lus Production · Mobile UI</p>

<div class="phone">
  <!-- ── Screen clip ── -->
  <div class="clip">
    <div class="track" id="track">

      <!-- ══════════════════════════════════
           S0 — FEED
      ══════════════════════════════════ -->
      <div class="screen" id="s0">
        <div class="top-bar">
          <span class="logo">Lus <em>Production</em></span>
          <div class="bar-icons">
            <button class="ib" title="Notifications"><i class="ti ti-bell"></i></button>
            <button class="ib" title="Messages"><i class="ti ti-brand-telegram"></i></button>
          </div>
        </div>
        <div class="scroller" id="feedScroll">
          <div class="stories-bar">
            <div class="stories-row" id="storiesRow"></div>
          </div>
          <div id="feedPosts"></div>
        </div>
      </div>

      <!-- ══════════════════════════════════
           S1 — POST DETAIL
      ══════════════════════════════════ -->
      <div class="screen" id="s1">
        <div class="top-bar" id="dtHeader">
          <div style="display:flex;align-items:center;gap:11px">
            <button class="ib" onclick="goTo(0)"><i class="ti ti-arrow-left"></i></button>
            <div class="ava ava-36" id="dtAva"></div>
            <div>
              <div style="font-size:14px;font-weight:600;color:#fff" id="dtName"></div>
              <div style="font-size:11px;color:var(--muted)" id="dtLoc"></div>
            </div>
          </div>

function goTo(idx) {
  screen = idx;
  document.getElementById('track').style.transform = `translateX(${-idx * 390}px)`;
  ['nb0','nb1','nb3','nb4'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('on');
  });
  if (idx === 0) document.getElementById('nb0').classList.add('on');
  if (idx === 2) document.getElementById('nb4').classList.add('on');
}

function openPostDetail(id) {
  openPost = id;

  setTimeout(() => document.getElementById('dtScroll').scrollTo(0, 0), 60);
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function blobs(arr) {
  return arr.map(b =>
    `<div class="blob" style="width:${b.w}px;height:${b.h}px;background:${b.c};${b.s}"></div>`
  ).join('');
}

function fmt(n) {
  return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K' : String(n);
}

/* ═══════════════════════════════════════

═══════════════════════════════════════ */
function toggleLike(id) {
  const p  = POSTS[id];
  p.liked  = !p.liked;
  p.likes += p.liked ? 1 : -1;

  [['fl','fll'], ['dl','dll']].forEach(([btnPfx, cntPfx]) => {
    const btn = document.getElementById(`${btnPfx}${id}`);
    const cnt = document.getElementById(`${cntPfx}${id}`);
    if (btn) {
      btn.classList.toggle('liked', p.liked);
      btn.querySelector('i').className = `ti ${p.liked ? 'ti-heart-filled' : 'ti-heart'}`;
    }
    if (cnt) cnt.textContent = `${fmt(p.likes)} likes`;
  });
}

function toggleSave(id) {
  const p = POSTS[id];
  p.saved = !p.saved;
  ['fs','ds'].forEach(pfx => {
    const btn = document.getElementById(`${pfx}${id}`);
    if (!btn) return;
    btn.classList.toggle('saved', p.saved);
    btn.querySelector('i').className = `ti ${p.saved ? 'ti-bookmark-filled' : 'ti-bookmark'}`;
  });
  showToast(p.saved ? 'Saved to collection' : 'Removed from saved');
}

function submitFeed(e, id) {
  if (e.key !== 'Enter') return;
  const inp  = e.target;
  const text = inp.value.trim();
  if (!text) return;
  POSTS[id].comments.push({
    init:'L', name:'lus_prod',
    ag:'linear-gradient(135deg,#C8621A,#FF9A3C)',
    text, time:'Just now', likes:0,
  });
  inp.value = '';
  const el = document.querySelector(`#pc${id} .more-comments`);
  if (el) el.textContent = `View all ${POSTS[id].comments.length} comments`;
  showToast('Comment posted!');
}

function submitDetail(e) {
  if (e.key !== 'Enter') return;
  const inp  = document.getElementById('dtInput');
  const text = inp.value.trim();
  if (!text) return;
  POSTS[openPost].comments.push({
    init:'L', name:'lus_prod',
    ag:'linear-gradient(135deg,#C8621A,#FF9A3C)',
    text, time:'Just now', likes:0,
  });
  inp.value = '';
  renderComments(openPost);
  // update "view all" count on feed card
  const el = document.querySelector(`#pc${openPost} .more-comments`);
  if (el) el.textContent = `View all ${POSTS[openPost].comments.length} comments`;
  showToast('Comment posted!');
  setTimeout(() => {
    const last = document.querySelector('#dtComments .cmt:last-child');
    last?.scrollIntoView({ behavior: 'smooth' });
  }, 60);
}

function toggleFollow() {
  followed = !followed;

  btn.textContent  = followed ? 'Following' : 'Follow';
  btn.className    = `p-btn ${followed ? 'secondary' : 'primary'}`;
  showToast(followed ? 'Following lus_prod' : 'Unfollowed lus_prod');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

  document.getElementById('svCaption').textContent  = s.caption;

  // progress bars
  document.getElementById('svProgs').innerHTML = STORIES.map((_, i) => `
    <div class="sv-track">
      <div class="sv-fill${i < svIdx ? ' done' : ''}" id="svf${i}"></div>
    </div>
  `).join('');

  const fill = document.getElementById(`svf${svIdx}`);

  svTick = setInterval(() => {
    svProgress = Math.min(svProgress + (TICK / SV_DUR) * 100, 100);
    fill.style.width = svProgress + '%';
    if (svProgress >= 100) {
      clearInterval(svTick);
      nextStory();
    }
  }, TICK);
}

function nextStory() {
  if (svIdx < STORIES.length - 1) {
    svIdx++;
    renderSV();
  } else {
    closeStory();
  }
}

function prevStory() {
  if (svIdx > 0) {
    svIdx--;
    renderSV();
  } else {
    // restart current
    svProgress = 0;
    renderSV();
  }
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
renderStories();
renderFeed();
renderProfileGrid();
goTo(0);
</script>
</body>
</html>
